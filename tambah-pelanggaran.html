```html
<!DOCTYPE html>
<html>
<head>
    <title>Tambah Pelanggaran</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background: linear-gradient(120deg, #eef2ff, #f8fafc);
}

.page-card{
    max-width: 650px;
    margin: auto;
    margin-top: 50px;
    border: none;
    border-radius: 28px;
    background: white;
    box-shadow: 0 20px 60px rgba(15,23,42,0.08);
    padding: 35px;
}

.page-title{
    font-weight: 800;
    color: #3730a3;
}

.info-box{
    background: #eef2ff;
    border-radius: 16px;
    padding: 18px;
    color: #3730a3;
}

.btn-danger{
    background: linear-gradient(135deg, #ef4444, #b91c1c);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
}

.btn-secondary{
    border-radius: 999px;
    padding: 10px 18px;
}

.form-control,
.form-select{
    border-radius: 14px;
    padding: 12px;
}

</style>

</head>
<body>

<script>

// ================= CEK LOGIN =================
if (!localStorage.getItem('login')) {

    window.location.href = 'index.html';
}

</script>

<div class="container">

    <div class="page-card">

        <h3 class="page-title mb-4">
            Tambah Pelanggaran
        </h3>

        <!-- INFO SISWA -->
        <div class="info-box mb-4">

            <div>
                <b>Nama:</b>
                <span id="namaSiswa">Memuat...</span>
            </div>

            <div>
                <b>Kelas:</b>
                <span id="kelasSiswa">Memuat...</span>
            </div>

        </div>

        <!-- FORM -->
        <form id="formPelanggaran">

            <input type="hidden" id="id_siswa">

            <!-- JENIS -->
            <div class="mb-3">

                <label class="form-label">
                    Nama Pelanggaran
                </label>

                <input 
                    type="text"
                    id="jenis"
                    class="form-control"
                    placeholder="Masukkan nama pelanggaran"
                    required
                >

            </div>

            <!-- KATEGORI -->
            <div class="mb-3">

                <label class="form-label">
                    Kategori
                </label>

                <select class="form-select" id="kategori">

                    <option value="">
                        -- Pilih --
                    </option>

                    <option value="1">
                        Ringan (1)
                    </option>

                    <option value="10">
                        Sedang (10)
                    </option>

                    <option value="20">
                        Berat (20)
                    </option>

                </select>

            </div>

            <!-- POIN -->
            <div class="mb-4">

                <label class="form-label">
                    Poin
                </label>

                <input 
                    type="number"
                    id="poin"
                    class="form-control"
                    required
                >

            </div>

            <div class="d-flex gap-2">

                <button class="btn btn-danger" type="submit">
                    Simpan
                </button>

                <a href="index.html" class="btn btn-secondary">
                    Kembali
                </a>

            </div>

        </form>

    </div>

</div>

<script>

if (!localStorage.getItem('login')) {

    window.location.href = 'index.html';
}

const params = new URLSearchParams(window.location.search);

const id_siswa = params.get('id');

if (!id_siswa) {

    alert('ID siswa tidak ditemukan');

    window.location.href = 'index.html';
}

document.getElementById('id_siswa').value = id_siswa;

document
.getElementById('kategori')

.addEventListener('change', function(){

    document.getElementById('poin').value = this.value;
});

fetch(`https://back-end47722.up.railway.app/api/siswa/get.php?id=${id_siswa}`)

.then(res => res.json())

.then(response => {

    if (response.status !== 'success') {

        alert('Siswa tidak ditemukan');

        window.location.href = 'index.html';

        return;
    }

    const siswa = response.data;

    document.getElementById('namaSiswa').innerText =
        siswa.nama_siswa;

    document.getElementById('kelasSiswa').innerText =
        siswa.kelas;
})

.catch(error => {

    console.log(error);

    alert('Gagal mengambil data siswa');
});

document
.getElementById('formPelanggaran')

.addEventListener('submit', function(event){

    event.preventDefault();

    const id = document
        .getElementById('id_siswa')
        .value;

    const jenis = document
        .getElementById('jenis')
        .value
        .trim();

    const poin = document
        .getElementById('poin')
        .value;

    if (!jenis || !poin) {

        alert('Data belum lengkap');

        return;
    }

    fetch('https://back-end47722.up.railway.app/api/pelanggaran/tambah.php', {

        method: 'POST',

        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        },

        body: `
            id_siswa=${encodeURIComponent(id)}
            &jenis=${encodeURIComponent(jenis)}
            &poin=${encodeURIComponent(poin)}
        `
    })

    .then(res => res.json())

    .then(response => {

        alert(response.message);

        if (response.status === 'success') {

            window.location.href = 'index.html';
        }
    })

    .catch(error => {

        console.log(error);

        alert('Gagal terhubung ke server');
    });
});

</script>

</body>
</html>
