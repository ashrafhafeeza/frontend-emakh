<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Tambah Pelanggaran</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background: linear-gradient(120deg,#eef2ff,#f8fafc);
}

.page-card{
    max-width:650px;
    margin:auto;
    margin-top:50px;
    border:none;
    border-radius:28px;
    background:white;
    box-shadow:0 20px 60px rgba(15,23,42,.08);
    padding:35px;
}

.page-title{
    font-weight:800;
    color:#3730a3;
}

.info-box{
    background:#eef2ff;
    border-radius:16px;
    padding:18px;
    color:#3730a3;
}

.btn-danger{
    background:linear-gradient(135deg,#ef4444,#b91c1c);
    border:none;
    border-radius:999px;
    padding:10px 18px;
}

.btn-secondary{
    border-radius:999px;
    padding:10px 18px;
}

.form-control,
.form-select{
    border-radius:14px;
    padding:12px;
}
</style>
</head>
<body>

<div class="container">
<div class="page-card">

<h3 class="page-title mb-4">
Tambah Pelanggaran
</h3>

<div class="info-box mb-4">
    <div>
        <b>Nama:</b>
        <span id="namaSiswa">Memuat...</span>
    </div>

    <div>
        <b>Kelas:</b>
        <span id="kelasSiswa">Memuat...</span>
    </div>
</div>

<form id="formPelanggaran">

<input type="hidden" id="id_siswa">

<div class="mb-3">
    <label class="form-label">Nama Pelanggaran</label>
    <input
        type="text"
        id="jenis"
        class="form-control"
        placeholder="Masukkan nama pelanggaran"
    >
</div>

<div class="mb-3">
    <label class="form-label">Kategori</label>

    <select id="kategori" class="form-select">
        <option value="">-- Pilih --</option>
        <option value="1">Ringan (1)</option>
        <option value="10">Sedang (10)</option>
        <option value="20">Berat (20)</option>
    </select>
</div>

<div class="mb-4">
    <label class="form-label">Poin</label>

    <input
        type="number"
        id="poin"
        class="form-control"
        readonly
    >
</div>

<div class="d-flex gap-2">
    <button type="submit" class="btn btn-danger">
        Simpan
    </button>

    <a href="dashboard.html" class="btn btn-secondary">
        Kembali
    </a>
</div>

</form>
</div>
</div>

<script>

// ================= LOGIN =================
if (!localStorage.getItem("login")) {
    window.location.href = "index.html";
}

// ================= AMBIL ID =================
const params = new URLSearchParams(window.location.search);
const id_siswa = params.get("id");

if (!id_siswa) {
    alert("ID siswa tidak ditemukan");
    window.location.href = "dashboard.html";
}

document.getElementById("id_siswa").value = id_siswa;

// ================= AUTO POIN =================
document
.getElementById("kategori")
.addEventListener("change", function () {
    document.getElementById("poin").value = this.value;
});

// ================= GET DATA SISWA =================
fetch(`https://back-end47722.up.railway.app/api/pelanggaran/get.php?id=${id_siswa}`)
.then(res => res.json())
.then(response => {

    if (response.status !== "success") {
        alert("Siswa tidak ditemukan");
        window.location.href = "dashboard.html";
        return;
    }

    const siswa = response.data[0];

    document.getElementById("namaSiswa").textContent = siswa.nama_siswa;
    document.getElementById("kelasSiswa").textContent = siswa.kelas;
})
.catch(error => {
    console.log(error);
    alert("Gagal mengambil data siswa");
});

// ================= SUBMIT =================
document
.getElementById("formPelanggaran")
.addEventListener("submit", function(e){

    e.preventDefault();

    const id = document.getElementById("id_siswa").value.trim();
    const jenis = document.getElementById("jenis").value.trim();
    const kategori = document.getElementById("kategori").value;
    const poin = document.getElementById("poin").value;

    if (jenis === "" || kategori === "" || poin === "") {
        alert("Data belum lengkap");
        return;
    }

    const formData = new URLSearchParams();

    formData.append("id_siswa", id);
    formData.append("jenis", jenis);
    formData.append("poin", poin);

    fetch("https://back-end47722.up.railway.app/api/pelanggaran/tambah.php", {
        method: "POST",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded"
        },
        body: formData.toString()
    })

    .then(async res => {

        const text = await res.text();

        try {
            return JSON.parse(text);
        } catch {
            throw new Error(text);
        }
    })

    .then(response => {

        alert(response.message);

        if (response.status === "success") {
            window.location.href = "dashboard.html";
        }
    })

    .catch(error => {
        console.log("ERROR:", error);
        alert("Gagal menyimpan data");
    });

});
</script>

</body>
</html>
